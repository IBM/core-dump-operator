# Administrator-only permissions: CoreDumpHandler controls privileged host agents.
# Bind only to trusted cluster administrators in the operator namespace.
# Tenant workloads only configure their upload secret; do not bind this role to tenants.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: coredumphandler-editor-role
rules:
- apiGroups:
  - charts.ibm.com
  resources:
  - coredumphandlers
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - charts.ibm.com
  resources:
  - coredumphandlers/status
  verbs:
  - get
